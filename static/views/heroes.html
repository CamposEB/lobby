<main class="hh-page hc-page" id="heroesPage">

  <nav class="hh-crumbs" aria-label="Você está em">
    <button type="button" data-hh-go="home">Início</button>
    <span aria-hidden="true">›</span>
    <b>Heróis</b>
  </nav>

  <!-- ═══════════ RECENTES ═══════════ -->
  <section class="hc-section">
    <header class="hc-section-head">
      <h2 class="hc-section-title">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="hc-section-icon">
          <path d="M12 2v6M12 16v6M2 12h6M16 12h6M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M19.1 4.9l-4.2 4.2M9.1 14.9l-4.2 4.2"/>
        </svg>
        Heróis Mais Recentes
      </h2>
    </header>
    <div class="hc-recent" id="hcRecent"></div>
  </section>

  <!-- ═══════════ TODOS ═══════════ -->
  <section class="hc-section">
    <header class="hc-section-head">
      <h2 class="hc-section-title">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="hc-section-icon">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Ver Todos os Heróis
      </h2>
      <span class="hc-count" id="hcCount">Carregando…</span>
    </header>

    <div class="hc-filters">
      <label class="hc-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3"/>
          <path d="m15.5 15.5 4.2 4.2"/>
        </svg>
        <input id="hcSearch" type="search" placeholder="Buscar heróis..." autocomplete="off">
      </label>

      <select id="hcSort" aria-label="Ordenar">
        <option value="name">Nome</option>
        <option value="win">Maior win rate</option>
        <option value="pick">Mais escolhidos</option>
        <option value="ban">Mais banidos</option>
        <option value="recent">Mais recentes</option>
      </select>

      <select id="hcRole" aria-label="Classe">
        <option value="">Todas as Roles</option>
      </select>

      <select id="hcLane" aria-label="Rota">
        <option value="">Todas as Lanes</option>
        <option value="EXP">EXP</option>
        <option value="Jungle">Jungle</option>
        <option value="Mid">Mid</option>
        <option value="Gold">Gold</option>
        <option value="Roam">Roam</option>
      </select>

      <select id="hcTier" aria-label="Tier">
        <option value="">Todos os Tiers</option>
        <option value="S">Tier S</option>
        <option value="A">Tier A</option>
        <option value="B">Tier B</option>
        <option value="C">Tier C</option>
      </select>

      <select id="hcDifficulty" aria-label="Dificuldade">
        <option value="">Qualquer Dificuldade</option>
        <option value="easy">Fácil</option>
        <option value="medium">Média</option>
        <option value="hard">Difícil</option>
      </select>

      <select id="hcSpeciality" aria-label="Especialidade">
        <option value="">Todas as Especialidades</option>
      </select>
    </div>

    <div class="hc-grid" id="hcGrid"></div>
    <p class="hc-empty" id="hcEmpty" hidden>Nenhum herói encontrado com esses filtros.</p>
  </section>

</main>

<style id="dm-inline-css">
#dmRoot {

  --dm-wall:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'><polygon points='42,12 74,28 74,60 42,76 10,60 10,28' fill='none' stroke='%23d4b45a' stroke-width='1.2' opacity='.06'/><polygon points='205,195 240,195 222,160' fill='none' stroke='%23ffffff' stroke-width='1.2' opacity='.05'/><polygon points='190,45 212,67 190,89 168,67' fill='none' stroke='%23d4b45a' stroke-width='1' opacity='.055'/><circle cx='65' cy='200' r='28' fill='none' stroke='%23ffffff' stroke-width='1.2' opacity='.045'/><line x1='130' y1='0' x2='260' y2='130' stroke='%23d4b45a' stroke-width='1' opacity='.04'/><polygon points='95,95 110,110 95,125 80,110' fill='%23ffffff' opacity='.035'/><circle cx='215' cy='240' r='2' fill='%23d4b45a' opacity='.06'/><circle cx='130' cy='130' r='1.6' fill='%23ffffff' opacity='.05'/><circle cx='160' cy='160' r='1.2' fill='%23d4b45a' opacity='.05'/><circle cx='100' cy='100' r='1.4' fill='%23ffffff' opacity='.04'/></svg>"),
    radial-gradient(70% 45% at 100% 0%,var(--dm-accent-soft),transparent 70%),

}

<!-- ═══════════════════════════════════════════════════════════
     PONTE: botão "Ver perfil" + selo verificado do cabeçalho
     ═══════════════════════════════════════════════════════════ -->
<script id="dm-profile-bridge">
(function () {
  'use strict';

  let currentUserId = null;

  const VERIFIED_ROLE_KEYS = new Set([
    'DEV', 'ADMIN', 'MOD', 'MODERADOR', 'MODERATOR'
  ]);

  function roleKeyFromProfile(data) {
    if (!data) return 'user';
    const raw = String(data.role || '').toLocaleLowerCase('pt-BR').trim();
    if (raw === 'dev' || raw === 'admin' || raw === 'mod') return raw;
    const roles = Array.isArray(data.community_roles) ? data.community_roles : [];
    for (const role of roles) {
      const key = String(role || '').toLocaleUpperCase('pt-BR').trim();
      if (key === 'DEV') return 'dev';
      if (key === 'ADMIN') return 'admin';
      if (key === 'MOD' || key === 'MODERADOR' || key === 'MODERATOR') return 'mod';
    }
    return 'user';
  }

  function isVerified(data) {
    if (!data) return false;
    if (typeof data.verified === 'boolean' && data.verified) return true;
    const key = roleKeyFromProfile(data);
    return key === 'dev' || key === 'admin' || key === 'mod';
  }

  function labelForRole(roleKey) {
    if (roleKey === 'dev')   return 'DEV verificado';
    if (roleKey === 'admin') return 'Administrador verificado';
    if (roleKey === 'mod')   return 'Moderador verificado';
    return 'Conta verificada';
  }

  function abrirPerfilAtual() {
    const userId = currentUserId;

    if (!userId) {
      console.warn('[dm-bridge] Nenhum userId na conversa atual.');
      return;
    }

    if (typeof window.abrirPerfil === 'function') {
      window.abrirPerfil(userId);
      return;
    }

    if (window.ProfileUI && typeof window.ProfileUI.renderOtherProfile === 'function') {
      const sendFn =
        (window.appSend && window.appSend) ||
        (window.send && window.send) ||
        null;
      if (sendFn) {
        sendFn({ t: 'profile_get', user_id: userId });
        if (typeof window.navegarParaAba === 'function') {
          window.navegarParaAba('profile');
        } else {
          const tab = document.getElementById('tab-profile');
          if (tab) tab.click();
        }
        return;
      }
    }

    document.dispatchEvent(new CustomEvent('profile:open', {
      detail: { userId }
    }));
  }

  function mount() {
    const btn = document.getElementById('dmViewProfile');
    if (!btn || btn.dataset.bridgeHooked === '1') return;
    btn.dataset.bridgeHooked = '1';
    btn.addEventListener('click', abrirPerfilAtual);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }

  window.DmProfileBridge = {
    setCurrentUser(userId) {
      currentUserId = userId || null;

      const btn = document.getElementById('dmViewProfile');
      if (btn) {
        if (userId) btn.dataset.userId = String(userId);
        else delete btn.dataset.userId;
      }

      const chat = document.getElementById('dmChat');
      if (chat) {
        if (userId) chat.dataset.userId = String(userId);
        else delete chat.dataset.userId;
      }
    },

    getCurrentUser() {
      return currentUserId;
    },

    openProfile() {
      abrirPerfilAtual();
    },

    /* ✅ Atualiza o selo de verificado no cabeçalho da conversa.
       Chame isso quando o servidor entregar o `profile` do outro usuário
       (por ex. ao tratar a mensagem "dm_history"). */
    setVerified(isVerifiedFlag, roleOrProfile) {
      const badge = document.getElementById('dmWithVerified');
      if (!badge) return;

      let roleKey = 'user';
      let verified = Boolean(isVerifiedFlag);

      if (roleOrProfile && typeof roleOrProfile === 'object') {
        roleKey = roleKeyFromProfile(roleOrProfile);
        verified = isVerified(roleOrProfile);
      } else if (typeof roleOrProfile === 'string') {
        const key = roleOrProfile.toLocaleLowerCase('pt-BR').trim();
        if (key === 'dev' || key === 'admin' || key === 'mod') {
          roleKey = key;
          verified = true;
        }
      }

      badge.hidden = !verified;

      if (verified) {
        const label = labelForRole(roleKey);
        badge.dataset.role = roleKey;
        badge.setAttribute('aria-label', label);
        badge.setAttribute('title', label);
        badge.style.animation = 'none';
        void badge.offsetWidth;
        badge.style.animation = '';
      } else {
        badge.removeAttribute('data-role');
        badge.setAttribute('aria-label', 'Conta verificada');
        badge.setAttribute('title', 'Conta verificada');
      }
    },

    /* ✅ Conveniência: recebe o objeto de perfil inteiro do servidor
       (aquele que vem em "dm_history" como `profile`) e aplica o selo. */
    applyProfile(profile) {
      this.setVerified(profile, profile);
    }
  };

  // Também deixa disponível globalmente para facilitar a integração
  window.dmSetVerified = (verified, roleOrProfile) =>
    window.DmProfileBridge.setVerified(verified, roleOrProfile);
  window.dmApplyProfile = (profile) =>
    window.DmProfileBridge.applyProfile(profile);
})();
</script>
